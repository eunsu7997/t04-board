<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  #body { transform-origin: 50% 100%; cursor: grab; }
  #pet { display: block; height: 220px; -webkit-user-drag: none; transition: opacity 120ms; }
  #pet.lie { height: 130px; }
  .flip #pet { transform: scaleX(-1); }

  /* 모든 움직임은 평행이동·회전·아주 작은 스케일만 사용하고, 0%와 100%가 같은 값이라 반복이 끊기지 않음 */
  .idle    #body { animation: breathe 2.6s ease-in-out infinite; }
  .walk    #body { animation: stroll 0.7s ease-in-out infinite; }
  .run     #body { animation: hop 0.36s ease-in-out infinite; }
  .pose    #body { animation: sway 1.8s ease-in-out infinite; }
  .excited #body { animation: jump 0.55s cubic-bezier(.3,0,.4,1) infinite; }
  .sleep   #body { animation: nod 2.4s ease-in-out infinite; }
  .curious #body { animation: look 2.2s ease-in-out infinite; }
  .lie     #body { animation: kick 1.6s ease-in-out infinite; }

  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.018); } }
  @keyframes stroll  { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-4px) rotate(1.5deg); } }
  @keyframes hop     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  @keyframes sway    { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes jump    { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-30px); } }
  @keyframes nod     { 0%,60%,100% { transform: rotate(0); } 75% { transform: rotate(4deg) translateY(2px); } 85% { transform: rotate(1deg); } }
  @keyframes look    { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 60% { transform: rotate(4deg); } }
  @keyframes kick    { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-1.5deg) translateY(-2px); } }
</style></head>
<body>
<div id="stage" class="idle"><div id="body"><img id="pet" src="sprites/idle.png" alt=""></div></div>
<script src="pet.js"></script>
</body></html>
